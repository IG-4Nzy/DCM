version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dcm_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-password}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: dcm_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-password}@mongodb:27017/dcm_database?authSource=admin
    volumes:
      - backend_uploads:/app/uploads
    cap_add:
      - NET_RAW
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dcm_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  backend_uploads:
