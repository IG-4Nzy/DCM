version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dcm_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: dcm_backend
    ports:
      - "8000:8000"
    environment:
      # Use the mongodb service name as host
      - MONGO_URI=mongodb://mongodb:27017/dcm
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dcm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
