server {
    listen 80;
    server_name _ dcms.vssc.dos.gov.in;

    # Disable server version disclosure
    server_tokens off;

    # Prevent internal IP disclosure in redirects
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    # Security Headers (Safe for Chrome / Edge / Firefox)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' RUNTIME_API_BASE_URL_PLACEHOLDER http: https: ws: wss:; form-action 'self'; frame-ancestors 'self'; base-uri 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden files/directories (dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent caching of entry index.html to guarantee fresh bundle hashes after deployments
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Cache hashed static assets (JS/CSS/images) immutably
    location /assets/ {
        include /etc/nginx/mime.types;
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single Page Application routing
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
